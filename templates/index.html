<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiGener | Floating Studio</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

    <main class="canvas-viewport" id="viewport">
        <div class="empty-state" id="emptyState">
            <h2>Welcome to CertiGener</h2>
            <p>Import a template from the dock to initialize the workspace.</p>
        </div>
        <canvas id="editorCanvas"></canvas>
    </main>

    <header class="floating-topbar">
        <div class="brand">CertiGener <span class="badge">Studio</span></div>
        <div class="divider"></div>
        <button class="btn-text" onclick="window.location.href='/download-samples'">Test Assets</button>
        <button class="btn-icon add-btn" onclick="addTextField()" title="Add Text Field">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Text Field
        </button>
    </header>

    <aside class="floating-dock">
        <div class="dock-section-title">Imports</div>
        
        <label class="dock-item" title="Import Template">
            <div class="dock-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            </div>
            <div class="dock-label">Template</div>
            <div class="status-dot" id="status-template"></div>
            <input type="file" id="templateInput" accept="image/*">
        </label>

        <label class="dock-item" title="Import CSV Data">
            <div class="dock-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
            </div>
            <div class="dock-label">Dataset</div>
            <div class="status-dot" id="status-data"></div>
            <input type="file" id="excelInput" accept=".csv, .xlsx">
        </label>

        <label class="dock-item" title="Import Custom Font">
            <div class="dock-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
            </div>
            <div class="dock-label">Typeface</div>
            <div class="status-dot" id="status-font"></div>
            <input type="file" id="fontInput" accept=".ttf">
        </label>
        
        <div class="dock-divider"></div>
        
        <button class="dock-btn-export" id="generateBtn" onclick="generateBatch()" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <div>Export</div>
        </button>
    </aside>

    <aside class="floating-inspector" id="propertiesPanel">
        <div class="inspector-header">
            <span>Inspector</span>
            <button class="close-inspector" onclick="selectField(null)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        
        <div class="inspector-body">
            <div class="prop-block">
                <label>Data Binding</label>
                <select id="phMapping" onchange="updateSelected()"></select>
            </div>

            <div class="prop-block">
                <label>Typeface</label>
                <select id="phFontFamily" onchange="updateSelected()">
                    <option value="arial.ttf">System Default</option>
                </select>
            </div>

            <div class="prop-row">
                <div class="prop-block">
                    <label>Scale</label>
                    <input type="number" id="phSize" value="40" oninput="updateSelected()">
                </div>
                <div class="prop-block">
                    <label>Color</label>
                    <input type="color" id="colorPicker" value="#000000" oninput="updateSelected()">
                </div>
            </div>

            <button class="btn-danger-outline" onclick="deleteSelected()">Remove Field</button>
        </div>
    </aside>

    <div class="glass-overlay" id="exportModal">
        <div class="glass-modal">
            <h3>Render Complete</h3>
            <p>Your certificates are ready for download.</p>
            <button class="btn-primary-solid" id="downloadZipBtn">Download .ZIP Archive</button>
            <div class="file-list-container" id="fileList"></div>
            <button class="btn-text-muted" onclick="closeModal()">Dismiss</button>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
