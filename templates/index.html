<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CertGener Basic</title>
    <style>
        body { display: flex; font-family: sans-serif; height: 100vh; margin: 0; }
        #sidebar { width: 300px; padding: 20px; background: #f4f4f4; border-right: 1px solid #ddd; overflow-y: auto; }
        #main { flex-grow: 1; background: #e0e0e0; display: flex; justify-content: center; align-items: center; position: relative; }
        canvas { background: white; box-shadow: 0 0 10px rgba(0,0,0,0.2); cursor: crosshair; }
        .control-group { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #ccc; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button { width: 100%; padding: 8px; margin-bottom: 5px; }
        #colorPicker { height: 40px; padding: 2px; }
    </style>
</head>
<body>

<!-- SIDEBAR CONTROLS -->
<div id="sidebar">
    <h2>CertGener </h2>
    
    <div class="control-group">
        <label>1. Upload Template</label>
        <input type="file" id="templateInput" accept="image/*">
    </div>

    <div class="control-group">
        <label>2. Upload Font (.ttf)</label>
        <input type="file" id="fontInput" accept=".ttf">
    </div>

    <div class="control-group">
        <label>3. Upload Excel Data</label>
        <input type="file" id="excelInput" accept=".csv, .xlsx">
    </div>

    <div id="placeholderControls" style="display:none;">
        <h3>Edit Placeholder</h3>
        <label>Name</label>
        <input type="text" id="phName" placeholder="e.g. Student Name">
        
        <label>Map to Excel Column</label>
        <select id="phMapping"></select>

        <label>Font Size</label>
        <input type="number" id="phSize" value="40">
        
        <label>Text Color</label>
        <input type="color" id="colorPicker" value="#000000">

        <button onclick="updatePlaceholder()">Update Placeholder</button>
        <button onclick="deletePlaceholder()" style="background: #ffcccc;">Delete</button>
    </div>

    <div class="control-group" style="margin-top:20px;">
        <button onclick="generateCertificates()" style="background: #4CAF50; color: white;">Generate Bulk ZIP</button>
    </div>
</div>

<!-- CANVAS AREA -->
<div id="main">
    <canvas id="editorCanvas"></canvas>
</div>

<script src="/static/js/script.js"></script>
</body>
</html>
